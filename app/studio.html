<!doctype html>
<html lang="es" data-theme="studio">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magoya · Deck Studio — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--paper-100,#F1EDE7); color:var(--ink-900); font-family:var(--font-body); -webkit-font-smoothing:antialiased; }
  .bar { display:flex; align-items:center; justify-content:space-between; padding:var(--space-3) var(--space-5); background:var(--ink-900); color:var(--cream-50); }
  .bar .brand { font-family:var(--font-display); font-weight:800; }
  .bar a { color:var(--emerald-400); font-size:var(--text-sm); font-weight:600; text-decoration:none; }
  .wrap { max-width:980px; margin:0 auto; padding:var(--space-6); display:grid; grid-template-columns:1fr 1fr; gap:var(--space-6); }
  @media (max-width:760px){ .wrap{ grid-template-columns:1fr; } }
  h2 { font-family:var(--font-display); font-weight:800; font-size:var(--text-2xl); letter-spacing:-.02em; margin-bottom:var(--space-4); }
  .card { background:#fff; border:1px solid var(--paper-200,#E6E1D8); border-radius:var(--radius-lg); padding:var(--space-5); }
  label { display:block; font-size:var(--text-sm); font-weight:600; margin:var(--space-3) 0 6px; }
  input[type=text] { width:100%; font:inherit; padding:.6em .8em; border:1px solid var(--paper-200,#E6E1D8); border-radius:var(--radius-md); background:var(--paper-50,#F7F4EF); }
  .seg { display:inline-flex; border:1px solid var(--paper-200,#E6E1D8); border-radius:var(--radius-full); overflow:hidden; }
  .seg button { font:inherit; font-size:var(--text-sm); background:transparent; border:0; padding:.4em 1em; cursor:pointer; }
  .seg button.on { background:var(--emerald-500); color:var(--ink-900); font-weight:700; }
  .checks { display:grid; gap:6px; }
  .checks label { display:flex; align-items:flex-start; gap:8px; font-weight:400; margin:0; font-size:var(--text-sm); }
  .design { display:grid; gap:10px; max-height:340px; overflow:auto; padding-right:4px; margin-top:6px; }
  .drow { border:1px solid var(--paper-200,#E6E1D8); border-radius:var(--radius-md); padding:10px 12px; background:var(--paper-50,#F7F4EF); }
  .drow .dh { font-family:var(--font-display); font-weight:700; font-size:13px; margin-bottom:6px; }
  .dctl { display:flex; align-items:center; gap:8px; margin-top:6px; flex-wrap:wrap; }
  .dctl > span { font-size:12px; color:var(--gray-600,#666); width:72px; flex:none; }
  .dseg { display:inline-flex; border:1px solid var(--paper-200,#E6E1D8); border-radius:var(--radius-full); overflow:hidden; }
  .dseg button { font:inherit; font-size:12px; background:#fff; border:0; padding:.3em .8em; cursor:pointer; }
  .dseg button.on { background:var(--emerald-500); color:var(--ink-900); font-weight:700; }
  .dctl select { font:inherit; font-size:12px; padding:.35em .5em; border:1px solid var(--paper-200,#E6E1D8); border-radius:var(--radius-md); background:#fff; }
  .dctl input[type=text] { flex:1; min-width:120px; font-size:13px; padding:.4em .6em; border:1px solid var(--paper-200,#E6E1D8); border-radius:var(--radius-md); }
  .dctl .ok { color:var(--emerald-700); font-size:13px; font-weight:700; }
  .pub-btn { margin-top:var(--space-5); width:100%; font:inherit; font-weight:700; background:var(--ink-900); color:#fff; border:0; border-radius:var(--radius-full); padding:.8em; cursor:pointer; }
  .pub-btn:disabled { opacity:.4; cursor:not-allowed; }
  .pub { border:1px solid var(--paper-200,#E6E1D8); border-radius:var(--radius-md); padding:var(--space-4); margin-bottom:var(--space-3); background:var(--paper-50,#F7F4EF); }
  .pub .name { font-family:var(--font-display); font-weight:700; }
  .pub .meta { font-size:var(--text-xs); color:var(--gray-600,#666); font-family:var(--font-mono); margin:4px 0; }
  .pub .row { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .pub .row a, .pub .row button { font:inherit; font-size:var(--text-sm); font-weight:600; text-decoration:none; border-radius:var(--radius-full); padding:.35em .9em; cursor:pointer; border:1px solid var(--paper-200,#E6E1D8); background:#fff; color:var(--ink-900); }
  .pub .row a.open { background:var(--emerald-500); border-color:var(--emerald-500); }
  .pub .row button.del { color:var(--color-danger,#D8514E); }
  .empty { color:var(--gray-600,#666); font-size:var(--text-sm); }
  .tagrow { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
</style>
</head>
<body>
<div class="bar"><span class="brand">Magoya · Deck Studio — Admin</span><a href="index.html">← Preview interactivo</a></div>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script type="module">
import htm from 'https://esm.sh/htm';
import { buildSnapshot, makeSlug, loadPubs, savePubs, resolveSlides } from './engine.js';
const html = htm.bind(React.createElement);
const { useState, useEffect } = React;

function Toggle({on,set}){ return html`<div class="seg"><button class=${on?'on':''} onClick=${()=>set(true)}>ON</button><button class=${!on?'on':''} onClick=${()=>set(false)}>OFF</button></div>`; }

const TEMPLATES={
  pillars:[{id:'pillars-cols',label:'Columnas'},{id:'pillars-stack',label:'Apilado'}],
  splitMedia:[{id:'split-left',label:'Foto izq'},{id:'split-right',label:'Foto der'},{id:'split-centered',label:'Centrado'}],
  dataHero:[{id:'dataHero-left',label:'Izquierda'},{id:'dataHero-centered',label:'Centrado'}],
  cta:[{id:'cta-centered',label:'Centrado'},{id:'cta-left',label:'Izquierda'}]
};

function App(){
  const [deck,setDeck]=useState(null);
  const [err,setErr]=useState(null);
  const [pubs,setPubs]=useState([]);
  const [clientName,setClientName]=useState('');
  const [audience,setAudience]=useState('Business');
  const [logos,setLogos]=useState(true);
  const [plat,setPlat]=useState(true);
  const [platformName,setPlatformName]=useState('');
  const [cases,setCases]=useState({});
  const [lastSlug,setLastSlug]=useState(null);
  const [pubErr,setPubErr]=useState(null);
  const [overrides,setOverrides]=useState({});

  useEffect(()=>{ fetch('./deck.json').then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(d=>{ setDeck(d); const c={}; (d.cases||[]).forEach(x=>c[x.id]=true); setCases(c); })
    .catch(e=>setErr(String(e))); setPubs(loadPubs()); },[]);

  if(err) return html`<div style=${{padding:40,fontFamily:'monospace',color:'#b00'}}>Error: ${err}</div>`;
  if(!deck) return html`<div style=${{padding:40,fontFamily:'monospace'}}>Cargando…</div>`;

  const setOv=(sid,patch)=>setOverrides(o=>({...o,[sid]:{...o[sid],...patch}}));
  const onFile=(sid,bid,file)=>{ const r=new FileReader(); r.onload=()=>setOv(sid,{media:{...((overrides[sid]||{}).media),[bid]:{src:r.result}}}); r.readAsDataURL(file); };
  const labelOf=b=>({heading:'Encabezado',body:'Cuerpo',metric:'Métrica',quote:'Cita',cta:'CTA',pillars:'Pilares',logoWall:'Logos',map:'Mapa',process:'Proceso',media:'Foto',kicker:'Kicker',index:'Índice'}[b.type]||b.type);
  const previewCfg={ clientName:clientName.trim()||'Cliente', audience, showClientLogos:logos, showPlatformName:plat, platformName:platformName.trim(), includedCaseIds:Object.keys(cases).filter(k=>cases[k]), slideOverrides:overrides };
  const designSlides=resolveSlides(deck, audience, previewCfg);

  const publish=()=>{
    setPubErr(null);
    const cfg=previewCfg;
    const snapshot=buildSnapshot(deck,cfg);
    const coreMissing=(deck.slides||[]).filter(s=>s.core).filter(s=>!snapshot.slides.some(rs=>rs.id===s.id));
    if(coreMissing.length){ setPubErr('Slides núcleo quedaron vacías: '+coreMissing.map(s=>s.id).join(', ')); return; }
    const photoMissing=snapshot.slides.flatMap(s=>s.blocks).filter(b=>b.type==='media' && !b.src && !b.caption);
    if(photoMissing.length){ setPubErr('Falta una foto en una slide. Agregala en "Diseño por slide".'); return; }
    const slug=makeSlug(cfg.clientName);
    const pub={ slug, clientName:cfg.clientName, audience, snapshot, publishedAt:new Date().toISOString() };
    const next=[pub,...loadPubs()];
    if(!savePubs(next)){ setPubErr('No se pudo guardar — almacenamiento lleno. Eliminá publicaciones viejas.'); return; }
    setPubs(next); setLastSlug(slug); setClientName(''); setPlatformName(''); setOverrides({});
  };
  const del=(slug)=>{ const next=loadPubs().filter(p=>p.slug!==slug); savePubs(next); setPubs(next); };
  const copy=(slug)=>{ const url=location.origin+location.pathname.replace(/studio\.html$/,'index.html')+'?slug='+slug; navigator.clipboard && navigator.clipboard.writeText(url); };

  return html`<div class="wrap">
    <div class="card">
      <h2>Nueva publicación</h2>
      <label>Cliente</label>
      <input type="text" value=${clientName} placeholder="Acme Corp" onInput=${e=>setClientName(e.target.value)}/>
      <label>Audiencia</label>
      <div class="seg">${['IT','Business','Product'].map(a=>html`<button key=${a} class=${audience===a?'on':''} onClick=${()=>setAudience(a)}>${a}</button>`)}</div>
      <div class="tagrow" style=${{marginTop:'1rem'}}>
        <div><label style=${{margin:0}}>Logos del cliente</label><${Toggle} on=${logos} set=${setLogos}/></div>
        <div><label style=${{margin:0}}>Nombre de plataforma</label><${Toggle} on=${plat} set=${setPlat}/></div>
      </div>
      ${plat && html`<div><label>Nombre de la plataforma</label><input type="text" value=${platformName} placeholder="AgriCloud" onInput=${e=>setPlatformName(e.target.value)}/></div>`}
      <label>Casos de éxito incluidos</label>
      <div class="checks">${(deck.cases||[]).map(c=>html`<label key=${c.id}><input type="checkbox" checked=${!!cases[c.id]} onChange=${e=>setCases(s=>({...s,[c.id]:e.target.checked}))}/> ${c.clientType} — ${c.resultMetric}</label>`)}</div>

      <label>Diseño por slide</label>
      <div class="design">
        ${designSlides.map(s=>{
          const ov=overrides[s.id]||{};
          const tpls=TEMPLATES[s.archetype]||[];
          const hb=s.blocks.find(b=>b.type==='heading');
          const media=s.blocks.find(b=>b.type==='media');
          const embBlocks=s.blocks.filter(b=>['heading','body','metric','quote'].includes(b.type));
          const mediaSrc=media && ov.media && ov.media[media.id] && ov.media[media.id].src;
          return html`<div class="drow" key=${s.id}>
            <div class="dh">${hb?hb.text:s.archetype}</div>
            ${tpls.length>1 && html`<div class="dctl"><span>Plantilla</span><div class="dseg">${tpls.map(t=>html`<button key=${t.id} class=${(ov.template||tpls[0].id)===t.id?'on':''} onClick=${()=>setOv(s.id,{template:t.id})}>${t.label}</button>`)}</div></div>`}
            ${embBlocks.length>0 && html`<div class="dctl"><span>Destacar</span><select value=${ov.emphasisBlockId||''} onChange=${e=>setOv(s.id,{emphasisBlockId:e.target.value||null})}><option value="">— ninguno —</option>${embBlocks.map(b=>html`<option key=${b.id} value=${b.id}>${labelOf(b)}</option>`)}</select></div>`}
            ${media && html`<div class="dctl"><span>Foto</span><input type="text" placeholder="URL de imagen" value=${(mediaSrc&&!String(mediaSrc).startsWith('data:'))?mediaSrc:''} onInput=${e=>setOv(s.id,{media:{...(ov.media),[media.id]:{src:e.target.value}}})}/><input type="file" accept="image/*" onChange=${e=>e.target.files[0]&&onFile(s.id,media.id,e.target.files[0])}/>${mediaSrc && html`<span class="ok">✓</span>`}</div>`}
          </div>`;
        })}
      </div>

      <button class="pub-btn" onClick=${publish}>Publicar →</button>
      ${pubErr && html`<div style=${{marginTop:'12px',fontSize:'13px',color:'var(--color-danger,#D8514E)'}}>⚠ ${pubErr}</div>`}
      ${lastSlug && !pubErr && html`<div style=${{marginTop:'12px',fontSize:'13px',color:'var(--emerald-700)'}}>✓ Publicado: <code>?slug=${lastSlug}</code></div>`}
    </div>

    <div class="card">
      <h2>Publicaciones (${pubs.length})</h2>
      ${pubs.length===0 ? html`<div class="empty">Todavía no publicaste ninguna. Creá una a la izquierda.</div>`
        : pubs.map(p=>html`<div class="pub" key=${p.slug}>
            <div class="name">${p.clientName}</div>
            <div class="meta">${p.audience} · logos ${p.snapshot.cfg.showClientLogos?'ON':'OFF'} · ${p.snapshot.slides.length} slides · /p/${p.slug}</div>
            <div class="row">
              <a class="open" href="index.html?slug=${p.slug}" target="_blank">Abrir</a>
              <button onClick=${()=>copy(p.slug)}>Copiar link</button>
              <button class="del" onClick=${()=>del(p.slug)}>Eliminar</button>
            </div>
          </div>`)}
    </div>
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
