<!doctype html>
<html lang="es" data-theme="studio">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magoya · Deck Studio (preview)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="slides.css">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#E9E9E5; color:var(--ink-900); font-family:var(--font-body); -webkit-font-smoothing:antialiased; }
  /* barra de control (admin-lite) */
  .bar { display:flex; align-items:center; gap:var(--space-4); flex-wrap:wrap; padding:var(--space-3) var(--space-5); background:var(--ink-900); color:var(--cream-50); position:sticky; top:0; z-index:10; }
  .bar .brand { font-family:var(--font-display); font-weight:800; letter-spacing:-.01em; }
  .bar .grp { display:flex; align-items:center; gap:8px; font-size:var(--text-sm); }
  .bar .seg { display:flex; border:1px solid rgba(236,227,219,.3); border-radius:var(--radius-full); overflow:hidden; }
  .bar .seg button { font:inherit; font-size:var(--text-sm); background:transparent; color:var(--cream-50); border:0; padding:.35em .9em; cursor:pointer; }
  .bar .seg button.on { background:var(--emerald-500); color:var(--ink-900); font-weight:700; }
  .bar .slug { margin-left:auto; font-family:var(--font-mono); font-size:var(--text-xs); color:#8FA396; }
  .bar .print { font:inherit; font-weight:600; font-size:var(--text-sm); background:var(--emerald-500); color:var(--ink-900); border:0; border-radius:var(--radius-full); padding:.45em 1.1em; cursor:pointer; }
  .stagewrap { max-width:1000px; margin:0 auto; padding:var(--space-6); }
  .stage { aspect-ratio:16/9; background:#fff; border-radius:var(--radius-lg); box-shadow:0 12px 40px rgba(0,0,0,.14); overflow:hidden; position:relative; }
  .nav { display:flex; align-items:center; justify-content:center; gap:var(--space-4); margin-top:var(--space-4); }
  .nav button { font:inherit; font-weight:600; background:#fff; border:1px solid var(--color-border-strong,#d2d2cc); border-radius:var(--radius-full); width:44px; height:44px; cursor:pointer; }
  .nav .count { font-family:var(--font-mono); font-size:var(--text-sm); color:var(--gray-600); min-width:70px; text-align:center; }
  /* print → leave-behind: TODAS las slides apiladas */
  .print-all { display:none; }
  @media print {
    .bar, .nav, .stagewrap { display:none !important; }
    body { background:#fff; }
    .print-all { display:block; }
    .print-all .stage { box-shadow:none; border-radius:0; page-break-after:always; aspect-ratio:16/9; margin:0; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script type="module">
import htm from 'https://esm.sh/htm';
import { resolveSlides, loadPubs } from './engine.js';
import { SlideView } from './renderers.js';
const html = htm.bind(React.createElement);
const { useState, useEffect, useRef } = React;

function App(){
  const slug = new URLSearchParams(location.search).get('slug');
  const [deck,setDeck]=useState(null);
  const [pubCfg,setPubCfg]=useState(null);
  const [published,setPublished]=useState(false);
  const [err,setErr]=useState(null);
  const [i,setI]=useState(0);
  const [showLogos,setShowLogos]=useState(true);
  const [showPlat,setShowPlat]=useState(true);
  const [aud,setAud]=useState('Business');
  const slidesRef=useRef([]);
  useEffect(()=>{
    if(slug){
      const pub = loadPubs().find(p=>p.slug===slug);
      if(pub){ setDeck(pub.snapshot); setPubCfg(pub.snapshot.cfg); setPublished(true); }
      else setErr('Publicación no encontrada: '+slug);
    } else {
      fetch('./deck.json').then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
        .then(d=>{ setDeck(d); setShowLogos(d.clientConfig.showClientLogos); setShowPlat(d.clientConfig.showPlatformName); })
        .catch(e=>setErr(String(e)));
    }
  },[]);
  useEffect(()=>{ const f=e=>{ const max=slidesRef.current.length-1; if(e.key==='ArrowRight')setI(v=>Math.min(v+1,max)); if(e.key==='ArrowLeft')setI(v=>Math.max(v-1,0)); }; window.addEventListener('keydown',f); return ()=>window.removeEventListener('keydown',f); },[]);
  if(err) return html`<div style=${{padding:40,fontFamily:'monospace',color:'#b00'}}>Error cargando deck.json — ${err}</div>`;
  if(!deck) return html`<div style=${{padding:40,fontFamily:'monospace'}}>Cargando deck…</div>`;
  const cfg = published ? pubCfg : {...deck.clientConfig, showClientLogos:showLogos, showPlatformName:showPlat};
  const slides = published ? (deck.slides||[]) : resolveSlides(deck, aud, cfg);
  slidesRef.current = slides;
  const idx = Math.min(i, slides.length-1);
  const cur = slides[idx];
  const Toggle = ({label,on,set}) => html`<div class="grp">${label}
    <div class="seg"><button class=${on?'on':''} onClick=${()=>set(true)}>ON</button><button class=${!on?'on':''} onClick=${()=>set(false)}>OFF</button></div></div>`;
  return html`<div>
    <div class="bar">
      <span class="brand">Magoya · ${published ? (cfg.clientName||'Presentación') : 'Deck Studio'}</span>
      ${!published && html`<${Toggle} label="Logos cliente" on=${showLogos} set=${setShowLogos}/>`}
      ${!published && html`<${Toggle} label="Nombre plataforma" on=${showPlat} set=${setShowPlat}/>`}
      ${!published && html`<div class="grp">Audiencia<div class="seg">${['IT','Business','Product'].map(a=>html`<button key=${a} class=${aud===a?'on':''} onClick=${()=>{setAud(a); setI(0);}}>${a}</button>`)}</div></div>`}
      ${!published && html`<a class="print" href="studio.html" style=${{textDecoration:'none'}}>Studio →</a>`}
      ${!published && html`<a class="print" href="modules.html" style=${{textDecoration:'none', background:'transparent', color:'var(--cream-50)', border:'1px solid rgba(236,227,219,.3)'}}>Módulos</a>`}
      <button class="print" onClick=${()=>window.print()}>Descargar (PDF)</button>
      ${published && html`<span class="slug">/p/${slug}</span>`}
    </div>
    <div class="stagewrap">
      <div class="stage"><div class="num">${String(idx+1).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')}</div><${SlideView} s=${cur} deck=${deck} cfg=${cfg}/></div>
      <div class="nav">
        <button aria-label="Slide anterior" onClick=${()=>setI(v=>Math.max(v-1,0))}>←</button>
        <span class="count">${idx+1} / ${slides.length}</span>
        <button aria-label="Slide siguiente" onClick=${()=>setI(v=>Math.min(v+1,slides.length-1))}>→</button>
      </div>
    </div>
    <div class="print-all" aria-hidden="true">
      ${slides.map((s,k)=>html`<div class="stage" key=${k}><${SlideView} s=${s} deck=${deck} cfg=${cfg}/></div>`)}
    </div>
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
