<svg viewBox="0 0 1200 50" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Motivo Magoya — banda de semicírculos">
  <!-- Banda festoneada "pastito": 24 semicírculos r=25 que NACEN del borde inferior.
       Regla de uso: width:100% + height:auto (o altura = ancho/24) para que los
       semicírculos se vean SIEMPRE completos y redondos — nunca cortados (toldito). -->
  <g fill="#00DE68">
    <path d="M0 50a25 25 0 0150 0Z"/><path d="M50 50a25 25 0 0150 0Z"/><path d="M100 50a25 25 0 0150 0Z"/><path d="M150 50a25 25 0 0150 0Z"/>
    <path d="M200 50a25 25 0 0150 0Z"/><path d="M250 50a25 25 0 0150 0Z"/><path d="M300 50a25 25 0 0150 0Z"/><path d="M350 50a25 25 0 0150 0Z"/>
    <path d="M400 50a25 25 0 0150 0Z"/><path d="M450 50a25 25 0 0150 0Z"/><path d="M500 50a25 25 0 0150 0Z"/><path d="M550 50a25 25 0 0150 0Z"/>
    <path d="M600 50a25 25 0 0150 0Z"/><path d="M650 50a25 25 0 0150 0Z"/><path d="M700 50a25 25 0 0150 0Z"/><path d="M750 50a25 25 0 0150 0Z"/>
    <path d="M800 50a25 25 0 0150 0Z"/><path d="M850 50a25 25 0 0150 0Z"/><path d="M900 50a25 25 0 0150 0Z"/><path d="M950 50a25 25 0 0150 0Z"/>
    <path d="M1000 50a25 25 0 0150 0Z"/><path d="M1050 50a25 25 0 0150 0Z"/><path d="M1100 50a25 25 0 0150 0Z"/><path d="M1150 50a25 25 0 0150 0Z"/>
  </g>
</svg>
