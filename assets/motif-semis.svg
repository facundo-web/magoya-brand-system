<svg viewBox="0 0 440 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Motivo Magoya — semicírculos">
  <!-- Patrón de semicírculos (heredado del brand, recoloreado a verde digital).
       Unidad: semicírculo r=44 rotado ±45°, grilla escalonada.
       Uso: siempre al corte — el patrón nace de un borde de la pieza, nunca flota cortado. -->
  <defs>
    <path id="s" d="M-44 0 A44 44 0 0 1 44 0 Z"/>
  </defs>
  <g fill="#00DE68">
    <use href="#s" transform="translate(55,55) rotate(-45)"/>
    <use href="#s" transform="translate(165,55) rotate(135)"/>
    <use href="#s" transform="translate(275,55) rotate(-45)"/>
    <use href="#s" transform="translate(385,55) rotate(135)"/>

    <use href="#s" transform="translate(110,165) rotate(135)"/>
    <use href="#s" transform="translate(220,165) rotate(-45)"/>
    <use href="#s" transform="translate(330,165) rotate(135)"/>
    <use href="#s" transform="translate(0,165) rotate(-45)"/>
    <use href="#s" transform="translate(440,165) rotate(-45)"/>

    <use href="#s" transform="translate(55,275) rotate(-45)"/>
    <use href="#s" transform="translate(165,275) rotate(135)"/>
    <use href="#s" transform="translate(275,275) rotate(-45)"/>
    <use href="#s" transform="translate(385,275) rotate(135)"/>

    <use href="#s" transform="translate(110,385) rotate(135)"/>
    <use href="#s" transform="translate(220,385) rotate(-45)"/>
    <use href="#s" transform="translate(330,385) rotate(135)"/>
    <use href="#s" transform="translate(0,385) rotate(-45)"/>
    <use href="#s" transform="translate(440,385) rotate(-45)"/>
  </g>
</svg>
